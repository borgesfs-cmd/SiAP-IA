[server]
maxUploadSize = 5
enableStaticServing = true

[browser]
gatherUsageStats = false

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "0.75rem"
buttonRadius = "full"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.light]
primaryColor = "#5552d9"
backgroundColor = "#f7f8fc"
secondaryBackgroundColor = "#eef0f8"
textColor = "#1d2140"
borderColor = "#dfe2f0"
linkColor = "#4a47c9"

[theme.light.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f2fa"
borderColor = "#e6e8f3"

[theme.dark]
primaryColor = "#8d8bf7"
backgroundColor = "#0f1222"
secondaryBackgroundColor = "#1a1e36"
textColor = "#e7e9f7"
borderColor = "#2a2f4d"
linkColor = "#a9a7ff"

[theme.dark.sidebar]
backgroundColor = "#131730"
secondaryBackgroundColor = "#1d2240"
borderColor = "#262b48"
